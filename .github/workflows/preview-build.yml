name: Preview branch build check

on:
  push:
    branches:
      - website-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and generate lockfile
        run: npm install

      - name: Capture npm security audit
        run: npm audit --json > npm-audit.json || true

      - name: Run production build
        run: npm run build

      - name: Save lockfile and audit report
        uses: actions/upload-artifact@v4
        with:
          name: curakart-build-diagnostics
          path: |
            package-lock.json
            npm-audit.json
          if-no-files-found: error
          retention-days: 7
